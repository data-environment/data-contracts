[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-contracts"
version = "0.1.0"
description = "Contratos de dados centralizados"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[tool.setuptools.packages.find]
include = ["data_contracts*"]